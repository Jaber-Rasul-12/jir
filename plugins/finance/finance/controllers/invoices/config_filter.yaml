scopes:
    created_at:
        label: finance.finance::lang.model.center.created_at
        type: date
        conditions: created_at >= ':filtered'
    published_at:
        label: finance.finance::lang.plugin.published_at
        type: daterange
        conditions: created_at >= ':after' AND created_at <= ':before'
    center:
        label: finance.finance::lang.model.invoice.center
        type: group
        conditions: center_id in (:filtered)
        modelClass: Finance\Finance\Models\Center
    type:
        label: finance.finance::lang.model.invoice.type
        type: group
        modelClass: Finance\Finance\Models\Invoice
        conditions: type IN (:filtered) 
        options: getTypeOptions
    model_type:
        label: finance.finance::lang.model.invoice.model_type
        type: group
        conditions: type_id in (:filtered)
        dependsOn: type
        options: getModelTypeOptions
        modelClass: Finance\Finance\Models\Invoice
    currency:
        label: finance.finance::lang.model.invoice.currency
        type: group
        modelClass: Finance\Finance\Models\Invoice
        conditions: currency IN (:filtered) 
        options: getCurrencyOptions