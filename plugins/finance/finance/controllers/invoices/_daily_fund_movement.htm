<!-- JavaScript for filtering -->
<script>
function filterTable(type) {
    var rows = document.querySelectorAll('.transaction-row');
    rows.forEach(function(row) {
        if (type === 'all' || row.dataset.type === type) {
            row.style.display = '';
        } else {
            row.style.display = 'none';
        }
    });
}
</script>
