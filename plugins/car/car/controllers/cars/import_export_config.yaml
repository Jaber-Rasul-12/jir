# ===================================
#  Import/Export Behavior Config
# ===================================

export:
    title: car.car::lang.plugin.export_excel
    modelClass: Car\Car\Models\ExportExcel
    fileName: cars_export.csv
    defaultFormatOptions:
      delimiter: ';'
      enclosure: '"'
      escape: '"'
      encoding: 'UTF-8'
      bom: true
    list: $/car/car/models/car/columns_excel.yaml