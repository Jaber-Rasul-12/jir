scopes:

    created_at:
        label: car.car::lang.model.rent.created_at
        type: date
        conditions: created_at >= ':filtered'
    published_at:
        label: car.car::lang.plugin.published_at
        type: daterange
        conditions: created_at >= ':after' AND created_at <= ':before'
    # model:
    #     label: 
    #     type: group
    #     conditions: model_id in (:filtered)
    #     modelClass: Car\Car\Models\Modelnew
    
    # brand:
    #     label: car.car::lang.model.car.brand
    #     type: group
    #     conditions: brand_id in (:filtered)
    #     modelClass: Car\Car\Models\Brand
    brand:
        label: car.car::lang.model.car.brand
        type: group
        conditions: brand_id in (:filtered)
        modelClass: Car\Car\Models\Car
        options: getBrandOptions
    
    city:
        label: car.car::lang.model.car.model
        type: group
        conditions: model_id in (:filtered)
        modelClass: Car\Car\Models\Car
        options: getModelOptions
        dependsOn: brand
    country:
        label: car.car::lang.model.car.country
        type: group
        conditions: country_id in (:filtered)
        modelClass: Car\Car\Models\Country
    country_new:
        label: car.car::lang.model.car.country_new
        type: group
        conditions: country_new_id in (:filtered)
        modelClass: Car\Car\Models\Country


    








