<script>
function printAllContracts() {
    // 1) اجمع كل الوثائق
    var contracts = document.querySelectorAll('#all-contracts-container .contract-wrapper');
    if (contracts.length === 0) {
        alert('لا توجد وثائق للطباعة');
        return;
    }

    // 2) ابنِ HTML يجمع كل الوثائق مع فواصل صفحات
    var allHtml = '';
    contracts.forEach(function (el, index) {
        var isLast = (index === contracts.length - 1);
        allHtml += '<div class="contract-page" style="page-break-after: ' + (isLast ? 'auto' : 'always') + '; break-after: ' + (isLast ? 'auto' : 'page') + ';">';
        allHtml += el.outerHTML;
        allHtml += '</div>';
    });

    // 3) افتح نافذة نظيفة
    var printWindow = window.open('', '_blank', 'width=900,height=700');
    if (!printWindow) {
        alert('الرجاء السماح بالنوافذ المنبثقة للطباعة');
        return;
    }

    printWindow.document.open();
    printWindow.document.write(`
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>طباعة كل وثائق التنازل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4 portrait;
            margin: 5mm !important;
        }

        html, body {
            margin: 0 !important;
            padding: 10px !important;
            width: 100% !important;
            background: #fff !important;
            font-family: 'Calibri', 'Carlito', 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            color: #000;
            zoom: 88%;

        }

        .contract-page {
            width: 100% !important;
            page-break-after: always;
            break-after: page;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .contract-page:last-child {
            page-break-after: auto;
            break-after: auto;
        }

        .contract-wrapper {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #fff !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            overflow: visible !important;
            position: relative !important;
        }

        .contract-wrapper > div {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #fff !important;
            box-shadow: none !important;
            border-radius: 0 !important;
        }

        .contract-background-image {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            opacity: 0.05 !important;
            z-index: 0 !important;
            pointer-events: none !important;
        }

        [style*="display: grid"] {
            gap: 4px 12px !important;
        }

        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            box-sizing: border-box !important;
        }

        h3, h4 {
            page-break-after: avoid;
        }
    </style>
</head>
<body>${allHtml}</body>
</html>
    `);
    printWindow.document.close();

    setTimeout(function () {
        printWindow.focus();
        printWindow.print();
    }, 1000);
}
</script>

<style>
@media print {
    .no-print {
        display: none !important;
    }
    .contract-preview-container {
        padding: 0 !important;
        background: #fff !important;
    }
    .contract-page {
        page-break-after: always;
        break-after: page;
    }
    .contract-page:last-child {
        page-break-after: auto;
        break-after: auto;
    }
}
</style>
