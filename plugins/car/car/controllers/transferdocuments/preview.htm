<script>
function printCleanContract() {
    // 1) خذ HTML الوثيقة فقط
    var contractEl = document.querySelector('.contract-wrapper');
    if (!contractEl) {
        alert('لم يتم العثور على الوثيقة');
        return;
    }
    var contractHtml = contractEl.outerHTML;

    // 2) افتح نافذة جديدة نظيفة
    var printWindow = window.open('', '_blank', 'width=900,height=700');
    if (!printWindow) {
        alert('الرجاء السماح بالنوافذ المنبثقة للطباعة');
        return;
    }

    // 3) اكتب داخل النافذة الجديدة صفحة HTML نظيفة تماماً
    printWindow.document.open();
    printWindow.document.write(`
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>طباعة وثيقة التنازل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        /* إعدادات الصفحة */
        @page {
            size: A4 portrait;
            margin: 5mm !important;
        }

        html, body {
            margin: 0 !important;
            padding: 10px !important;
            width: 100% !important;
            background: #fff !important;
            font-family: 'Calibri', 'Carlito', 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            color: #000;
            zoom: 90%;
        }

        /* الوثيقة تأخذ كامل العرض بدون أي قيود */
        .contract-wrapper {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #fff !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            overflow: visible !important;
        }

        .contract-wrapper > div {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;     /* ألغِ الحشو الداخلي تماماً */
            background: #fff !important;
            box-shadow: none !important;
            border-radius: 0 !important;
        }

        /* صورة الخلفية */
        .contract-background-image {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            opacity: 0.05 !important;
            z-index: -1 !important;
            pointer-events: none !important;
        }

        /* ضبط الشبكات */
        [style*="display: grid"] {
            gap: 4px 12px !important;
        }

        /* منع قطع العناصر */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            box-sizing: border-box !important;
        }

        h3, h4 {
            page-break-after: avoid;
        }
    </style>
</head>
<body>${contractHtml}</body>
</html>
    `);
    printWindow.document.close();

    // 4) انتظر تحميل المحتوى والخطوط ثم اطبع
    setTimeout(function () {
        printWindow.focus();
        printWindow.print();
    }, 800);
}
</script>
