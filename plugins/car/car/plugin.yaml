plugin:
    name: 'car.car::lang.plugin.name'
    description: 'car.car::lang.plugin.description'
    author: car
    icon: 'fas icon-car'
    replaces: {  }
permissions:
    log_changes_cars:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.log_changes_cars'
    cars_menu:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.cars_menu'
    brands:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.brands'
    models:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.models'
    country:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.country'
    cars:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.cars'
    customers:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.customers'
    rents:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.rents'
navigation:
    cars_settings:
        label: 'car.car::lang.plugin.cars_settings'
        url: car/car/countries
        icon: icon-cogs
        permissions:
            - cars_menu
        sideMenu:
            country:
                label: 'car.car::lang.plugin.country'
                url: car/car/countries
                icon: icon-globe
                permissions:
                    - country
            brand:
                label: 'car.car::lang.plugin.brand'
                url: car/car/brands
                icon: icon-trademark
                permissions:
                    - brands
            model:
                label: 'car.car::lang.plugin.model'
                url: car/car/modelscontrollers
                icon: icon-cube
                permissions:
                    - models
    cars:
        label: 'car.car::lang.plugin.cars'
        url: car/car/cars
        icon: icon-car
        permissions:
            - cars_menu
        sideMenu:
            cars:
                label: 'car.car::lang.plugin.cars'
                url: car/car/cars
                icon: icon-car
                permissions:
                    - cars
            customers:
                label: 'car.car::lang.plugin.customers'
                url: car/car/customers
                icon: icon-user
                permissions:
                    - customers
            rents:
                label: 'car.car::lang.plugin.rents'
                url: car/car/rents
                icon: icon-renren
                permissions:
                    - rents
            reports:
                label: 'car.car::lang.plugin.reports'
                url: car/car/statistics
                icon: icon-bar-chart
                permissions:
                    - rents