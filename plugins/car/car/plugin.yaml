plugin:
    name: 'car.car::lang.plugin.name'
    description: 'car.car::lang.plugin.description'
    author: car
    icon: 'fas icon-car'
    replaces: {  }
permissions:
    log_changes_cars:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.log_changes_cars'
    cars_menu:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.cars_menu'
    brands:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.brands'
    models:
        tab: 'car.car::lang.plugin.cars'
        label: 'car.car::lang.plugin.models'
